name: Apply migration ops_events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supabase/migration-ops-events.sql
      - scripts/apply-migration-ops-events.mjs
      - scripts/vercel-production-env.sh
      - src/lib/bootstrap-migrations.ts

jobs:
  apply:
    name: Create ops_events table
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Apply migration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ] && [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "Pulling POSTGRES_URL from Vercel production env..."
            bash scripts/vercel-production-env.sh .env.vercel.prod
            # shellcheck disable=SC1091
            source scripts/load-env-file.sh .env.vercel.prod
            export SUPABASE_DB_URL="${SUPABASE_DB_URL:-${POSTGRES_URL_NON_POOLING:-${POSTGRES_URL:-}}}"
          fi
          node scripts/apply-migration-ops-events.mjs || {
            echo "Direct apply failed — trying production API..."
            if [ -z "${CRON_SECRET:-}" ]; then
              echo "::warning::Will apply on Vercel cold start (bootstrap-migrations) after deploy"
              exit 0
            fi
            curl -sf -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://sunrise-cafe-six.vercel.app/api/admin/migrations/apply-ops-events"
          }

  deploy-if-needed:
    name: Deploy production + verify ops_events
    runs-on: ubuntu-latest
    needs: apply
    if: always()
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Deploy production when SHA drift
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN unset — skip auto deploy"
            exit 0
          fi
          EXPECTED="$(git rev-parse HEAD)"
          ACTUAL="$(curl -sf "$PRODUCTION_URL/api/version" | jq -r '.commit // empty')"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "Production already at $EXPECTED"
            exit 0
          fi
          echo "Deploying: prod=$ACTUAL expected=$EXPECTED"
          bash scripts/orchestrator/deploy.sh --wait 300 || true

      - name: Verify ops_events via PostgREST
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then exit 0; fi
          CODE=$(curl -sS -o /tmp/ops_probe.json -w '%{http_code}' \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/ops_events?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          if [ "$CODE" = "200" ]; then
            echo "ops_events table ready (HTTP 200)"
            exit 0
          fi
          echo "::warning::ops_events probe HTTP $CODE: $(cat /tmp/ops_probe.json)"
          exit 0
