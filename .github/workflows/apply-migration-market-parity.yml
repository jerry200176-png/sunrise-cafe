name: Verify historical market parity schema

on:
  workflow_dispatch:

jobs:
  paused:
    name: Migration paused — backup protection required
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Explain why migration cannot run
        run: |
          echo '::error::Migration is paused until an encrypted, retained backup and a reviewed migration path are verified.'
          exit 1

  apply:
    # The verifier remains disabled along with the legacy migration workflow.
    if: ${{ false }}
    name: Read-only market parity probe (paused)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify selected REST fields (never apply SQL)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-production-migration-phase.mjs --verify market-parity
