name: Orchestrator Heartbeat

on:
  schedule:
    # Daily 02:00 UTC = 10:00 Asia/Taipei
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  orchestrator-plan:
    name: Generate engineering plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run orchestrator (discover → prioritize → plan)
        run: npm run cto:orchestrator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_URL: https://sunrise-cafe-six.vercel.app

      - name: Upload orchestrator artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orchestrator-${{ github.run_id }}
          path: |
            docs/internal/automation/ORCHESTRATOR_PLAN.md
            orchestrator/priority.json
            orchestrator/discover.env
            orchestrator/state.json
          retention-days: 30

      - name: Governance gate (informational)
        if: always()
        run: npm run cto:governance || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
