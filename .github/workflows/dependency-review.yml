# Blocking dependency review on PRs (Gap #8). Public repo: the dependency graph is available.
# Allowlist for false positives: .github/dependency-review-config.yml `allow-ghsas`
# (mirrored in .github/audit-allowlist.json, which npm-audit-gate.mjs uses).
name: Dependency review

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/dependency-review-config.yml
      - .github/workflows/dependency-review.yml

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
