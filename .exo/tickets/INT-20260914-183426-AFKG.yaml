id: INT-20260914-183426-AFKG
title: Sunrise in-app remittance reporting and reconciliation
intent: Sunrise in-app remittance reporting and reconciliation
kind: intent
brain_dump: 'Improve Sunrise Cafe deposit workflow: after bank transfer the customer
  reports transfer in Sunrise with minimum identifying information; operator reconciles
  in an authenticated queue; only explicit operator confirmation moves the existing
  payment source of truth to paid and the reservation to confirmed; then reuse the
  existing reliable LINE outbox/idempotency/retry path. No gateway, bank API, production
  activation, production data mutation, or real customer messages.'
boundary: Do not add payment providers or banking integration; do not mutate production;
  do not redesign the payment ledger; do not weaken the invariant that customer reports
  are awaiting reconciliation and never paid; do not change refunds, chargebacks,
  or unrelated reservation architecture.
success_condition: Customer pending reservations can submit one idempotent transfer
  report with amount and last digits; authorized operators can safely reconcile matching
  reports exactly once; stale/cancelled/expired/paid reservations fail safe; confirmation
  enqueues one existing deduped LINE notice after commit; migration, tests, lint,
  typecheck/build evidence are recorded; no production activation.
