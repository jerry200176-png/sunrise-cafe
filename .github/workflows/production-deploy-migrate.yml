# Deploy production + apply pending DB migrations when main advances.
# Complements verify-production (SHA poll) with one immediate deploy attempt.
# deploy.sh records Vercel quota/rate-limit failures and ends without retrying;
# this keeps the sole deploy writer from burning quota in a retry loop.
# Phase order is enforced by job dependencies:
# predeploy_migrate -> predeploy_verify -> deploy -> postdeploy_migrate -> postdeploy_verify.

name: Production deploy and migrate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force a Vercel production deploy even when the source SHA is already live (used for runtime env activation)"
        required: false
        default: false
        type: boolean
      release_mode:
        description: "The priority code-only mode is restricted to the reviewed one-use tree"
        required: true
        default: blocked-migrations
        type: choice
        options:
          - blocked-migrations
          - priority-code-only
      reviewed_tree:
        description: "Full tree SHA from the exact CI-passing independently reviewed PR head"
        required: false
        type: string

permissions:
  contents: read

# Serialize the sole repository-controlled production deploy writer.
# Verification is intentionally read-only and never competes for Vercel quota.
concurrency:
  group: production-deploy-main
  cancel-in-progress: false

jobs:
  deployment_preflight:
    name: Validate deployment intent
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_mode != 'priority-code-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject unverified forced activation
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy || false }}
        run: |
          if [ "${FORCE_DEPLOY:-false}" = "true" ]; then
            echo "::error::Forced deployment requires independent deployment-identity verification"
            exit 1
          fi
          echo "::error::Release blocked: deployment writer fencing and a D7 recovery path are not verified"
          exit 1

  predeploy_migrate:
    name: Apply predeploy migrations
    runs-on: ubuntu-latest
    needs: deployment_preflight
    timeout-minutes: 15
    env:
      # Public encryption recipient is mandatory; no plaintext artifact fallback.
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Require backup encryption recipient
        run: '[ -n "${BACKUP_AGE_RECIPIENT//[[:space:]]/}" ] || { echo "::error::backup encryption recipient missing: migrations will not run"; exit 1; }'
      - name: Install age
        run: sudo apt-get install -y -qq --no-install-recommends age
      - name: Validate database URL for the backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          source scripts/resolve-db-url.sh
      - name: Pre-migration backup (predeploy)
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/pre-migration-backup.sh predeploy
      - name: Validate backup files before upload
        env:
          BACKUP_FILE: ${{ steps.backup.outputs.artifact_path }}
          MANIFEST_FILE: ${{ steps.backup.outputs.manifest_path }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_FILE" == *.dump.age && -s "$BACKUP_FILE" && -s "$MANIFEST_FILE" ]] || { echo "::error::encrypted backup or manifest missing"; exit 1; }
      - name: Upload encrypted backup
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-backup-predeploy_migrate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.backup.outputs.artifact_path }}
            ${{ steps.backup.outputs.manifest_path }}
          retention-days: 3
          if-no-files-found: error
      - name: Verify backup upload completed
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: bash scripts/verify-backup-upload.sh

      - name: Apply canonical predeploy phase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          BACKUP_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/run-production-migration-phase.mjs predeploy

  predeploy_verify:
    name: Verify predeploy migrations
    runs-on: ubuntu-latest
    needs: predeploy_migrate
    timeout-minutes: 15
    env:
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Require backup encryption recipient
        run: '[ -n "${BACKUP_AGE_RECIPIENT//[[:space:]]/}" ] || { echo "::error::backup encryption recipient missing: migrations will not run"; exit 1; }'
      - name: Install age
        run: sudo apt-get install -y -qq --no-install-recommends age
      - name: Validate database URL for the backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          source scripts/resolve-db-url.sh
      - name: Pre-migration backup (predeploy)
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/pre-migration-backup.sh predeploy
      - name: Validate backup files before upload
        env:
          BACKUP_FILE: ${{ steps.backup.outputs.artifact_path }}
          MANIFEST_FILE: ${{ steps.backup.outputs.manifest_path }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_FILE" == *.dump.age && -s "$BACKUP_FILE" && -s "$MANIFEST_FILE" ]] || { echo "::error::encrypted backup or manifest missing"; exit 1; }
      - name: Upload encrypted backup
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-backup-predeploy_verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.backup.outputs.artifact_path }}
            ${{ steps.backup.outputs.manifest_path }}
          retention-days: 3
          if-no-files-found: error
      - name: Verify backup upload completed
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: bash scripts/verify-backup-upload.sh

      - name: Re-run canonical predeploy verification
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          BACKUP_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/run-production-migration-phase.mjs predeploy

  deploy:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    needs: predeploy_verify
    timeout-minutes: 25
    outputs:
      deployment_attempted: ${{ steps.production_deploy.outputs.deployment_attempted }}
      deployment_id: ${{ steps.production_deploy.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - name: Record trusted main head for deploy-health
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/record-deploy-health-head.mjs
      - run: npm ci
      - name: Deploy if SHA drift
        id: production_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
        run: |
          set -euo pipefail
          EXPECTED="$(git rev-parse HEAD)"
          if ! [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot verify the checked-out commit"
            exit 1
          fi
          VERSION="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$PRODUCTION_URL/api/version")" || {
            echo "::error::Production version unavailable or invalid"
            exit 1
          }
          ACTUAL="$(printf '%s' "$VERSION" | jq -er '.commit | strings')" || { echo "::error::Production commit unavailable"; exit 1; }
          if ! [[ "$ACTUAL" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Production version is malformed"
            exit 1
          fi
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            DEPLOYMENT_ID="$(printf '%s' "$VERSION" | jq -er '.deployment_id | strings')" || { echo "::error::Production deployment identity unavailable"; exit 1; }
            [[ "$DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "::error::Production deployment identity malformed"; exit 1; }
            echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
            echo "Production already at $EXPECTED"
            exit 0
          fi
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Deployment required but VERCEL_TOKEN is unavailable"
            exit 1
          fi
          echo "Deploying the checked-out commit"
          # A command failure can still follow a successful remote deployment.
          # Preserve runtime watch even if the confirmation below fails.
          echo "deployment_attempted=true" >> "$GITHUB_OUTPUT"
          bash scripts/orchestrator/deploy.sh --wait 420 || {
            echo "::error::Deploy did not complete; postdeploy migrations are blocked"
            exit 1
          }
          VERSION="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$PRODUCTION_URL/api/version")" || {
            echo "::error::Cannot confirm production version after deployment"
            exit 1
          }
          ACTUAL="$(printf '%s' "$VERSION" | jq -er '.commit | strings')" || { echo "::error::Production commit unavailable"; exit 1; }
          DEPLOYMENT_ID="$(printf '%s' "$VERSION" | jq -er '.deployment_id | strings')" || { echo "::error::Production deployment identity unavailable"; exit 1; }
          [[ "$ACTUAL" =~ ^[0-9a-f]{40}$ && "$ACTUAL" = "$EXPECTED" ]] || { echo "::error::Production version does not match; postdeploy migrations are blocked"; exit 1; }
          [[ "$DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "::error::Production deployment identity malformed"; exit 1; }
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

  postdeploy_migrate:
    name: Apply postdeploy migrations
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    env:
      # Public encryption recipient is mandatory; no plaintext artifact fallback.
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Block postdeploy until deployment writers are fenced
        run: |
          echo "::error::Postdeploy is disabled until an enforceable deployment-writer fence is reviewed"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Require backup encryption recipient
        run: '[ -n "${BACKUP_AGE_RECIPIENT//[[:space:]]/}" ] || { echo "::error::backup encryption recipient missing: migrations will not run"; exit 1; }'
      - name: Install age
        run: sudo apt-get install -y -qq --no-install-recommends age
      - name: Validate database URL for the backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          source scripts/resolve-db-url.sh
      - name: Pre-migration backup (postdeploy)
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/pre-migration-backup.sh postdeploy
      - name: Validate backup files before upload
        env:
          BACKUP_FILE: ${{ steps.backup.outputs.artifact_path }}
          MANIFEST_FILE: ${{ steps.backup.outputs.manifest_path }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_FILE" == *.dump.age && -s "$BACKUP_FILE" && -s "$MANIFEST_FILE" ]] || { echo "::error::encrypted backup or manifest missing"; exit 1; }
      - name: Upload encrypted backup
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-backup-postdeploy_migrate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.backup.outputs.artifact_path }}
            ${{ steps.backup.outputs.manifest_path }}
          retention-days: 3
          if-no-files-found: error
      - name: Verify backup upload completed
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: bash scripts/verify-backup-upload.sh

      - name: Apply canonical postdeploy phase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
          EXPECTED_DEPLOYMENT_ID: ${{ needs.deploy.outputs.deployment_id }}
          BACKUP_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # Recheck immediately before the postdeploy runner. This is not a lock
          # against an independent deployment after the check.
          EXPECTED="$(git rev-parse HEAD)"
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Cannot verify checked-out commit"; exit 1; }
          VERSION="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$PRODUCTION_URL/api/version")" || {
            echo "::error::Cannot confirm production version before postdeploy"
            exit 1
          }
          ACTUAL="$(printf '%s' "$VERSION" | jq -er '.commit | strings')" || { echo "::error::Production commit unavailable"; exit 1; }
          DEPLOYMENT_ID="$(printf '%s' "$VERSION" | jq -er '.deployment_id | strings')" || { echo "::error::Production deployment identity unavailable"; exit 1; }
          [[ "$ACTUAL" =~ ^[0-9a-f]{40}$ && "$ACTUAL" = "$EXPECTED" ]] || { echo "::error::Production version changed; postdeploy migrations are blocked"; exit 1; }
          [[ "${EXPECTED_DEPLOYMENT_ID:-}" =~ ^dpl_[A-Za-z0-9]+$ && "$DEPLOYMENT_ID" = "$EXPECTED_DEPLOYMENT_ID" ]] || { echo "::error::Production deployment identity changed; postdeploy migrations are blocked"; exit 1; }
          node scripts/run-production-migration-phase.mjs postdeploy

      - name: Verify ops_events
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CODE=$(curl -sS -o /tmp/ops_probe.json -w '%{http_code}' \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/ops_events?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          echo "ops_events probe: HTTP $CODE"
          [ "$CODE" = "200" ] || cat /tmp/ops_probe.json || true

      - name: Verify deploy-health Cron runtime
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is unavailable for the production deploy-health probe"
            exit 1
          fi
          CODE=$(curl -sS -o /tmp/deploy_health_probe.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://sunrise-cafe-six.vercel.app/api/admin/reminders/deploy-health")
          echo "deploy-health probe: HTTP $CODE"
          jq '{ok, sha_parity, benign_drift, main, prod}' /tmp/deploy_health_probe.json
          [ "$CODE" = "200" ]
          jq -e '.ok == true and (.sha_parity == true or .benign_drift == true)' \
            /tmp/deploy_health_probe.json >/dev/null
          if grep -Fq 'Could not resolve main branch SHA' /tmp/deploy_health_probe.json; then
            echo "::error::legacy GitHub main-SHA resolution error is still present"
            exit 1
          fi

      - name: Verify market-parity columns
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for col in guest_confirmed_at deposit_urgent_reminder_sent_at; do
            CODE=$(curl -sS -o /tmp/col.json -w '%{http_code}' \
              "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/reservations?select=${col}&limit=1" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
            echo "reservations.${col}: HTTP $CODE"
            [ "$CODE" = "200" ] || cat /tmp/col.json || true
          done
          for col in staff_called_at staff_alerted_at; do
            CODE=$(curl -sS -o /tmp/col.json -w '%{http_code}' \
              "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/waitlist?select=${col}&limit=1" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
            echo "waitlist.${col}: HTTP $CODE"
            [ "$CODE" = "200" ] || cat /tmp/col.json || true
          done

      - name: Verify LINE reminder delivery ledger
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/line_ledger.json -w '%{http_code}' \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/line_reminder_deliveries?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          echo "line_reminder_deliveries probe: HTTP $CODE"
          [ "$CODE" = "200" ] || { cat /tmp/line_ledger.json || true; exit 1; }
          RPC_CODE=$(curl -sS -o /tmp/line_claim.json -w '%{http_code}' \
            -X POST "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/rpc/claim_line_reminder_delivery" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"p_reminder_type":"d1_group","p_reminder_date":"2099-01-01","p_reservation_id":"00000000-0000-4000-8000-000000000000","p_recipient_type":"group","p_recipient_id":"ledger-probe"}')
          echo "claim_line_reminder_delivery probe: HTTP $RPC_CODE"
          if grep -Eiq 'PGRST202|Could not find the function' /tmp/line_claim.json; then
            cat /tmp/line_claim.json
            exit 1
          fi
          [ "$RPC_CODE" -lt 500 ]

  postdeploy_verify:
    name: Verify postdeploy migrations
    runs-on: ubuntu-latest
    needs: [deploy, postdeploy_migrate]
    timeout-minutes: 15
    env:
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Block postdeploy verification until deployment writers are fenced
        run: |
          echo "::error::Postdeploy verification reruns database migrations and is disabled until an enforceable deployment-writer fence is reviewed"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Require backup encryption recipient
        run: '[ -n "${BACKUP_AGE_RECIPIENT//[[:space:]]/}" ] || { echo "::error::backup encryption recipient missing: migrations will not run"; exit 1; }'
      - name: Install age
        run: sudo apt-get install -y -qq --no-install-recommends age
      - name: Validate database URL for the backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          source scripts/resolve-db-url.sh
      - name: Pre-migration backup (postdeploy)
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/pre-migration-backup.sh postdeploy
      - name: Validate backup files before upload
        env:
          BACKUP_FILE: ${{ steps.backup.outputs.artifact_path }}
          MANIFEST_FILE: ${{ steps.backup.outputs.manifest_path }}
        run: |
          set -euo pipefail
          [[ "$BACKUP_FILE" == *.dump.age && -s "$BACKUP_FILE" && -s "$MANIFEST_FILE" ]] || { echo "::error::encrypted backup or manifest missing"; exit 1; }
      - name: Upload encrypted backup
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-backup-postdeploy_verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.backup.outputs.artifact_path }}
            ${{ steps.backup.outputs.manifest_path }}
          retention-days: 3
          if-no-files-found: error
      - name: Verify backup upload completed
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: bash scripts/verify-backup-upload.sh

      - name: Re-run canonical postdeploy verification
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
          EXPECTED_DEPLOYMENT_ID: ${{ needs.deploy.outputs.deployment_id }}
          BACKUP_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # Recheck immediately before the postdeploy runner. This is not a lock
          # against an independent deployment after the check.
          EXPECTED="$(git rev-parse HEAD)"
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Cannot verify checked-out commit"; exit 1; }
          VERSION="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$PRODUCTION_URL/api/version")" || {
            echo "::error::Cannot confirm production version before postdeploy"
            exit 1
          }
          ACTUAL="$(printf '%s' "$VERSION" | jq -er '.commit | strings')" || { echo "::error::Production commit unavailable"; exit 1; }
          DEPLOYMENT_ID="$(printf '%s' "$VERSION" | jq -er '.deployment_id | strings')" || { echo "::error::Production deployment identity unavailable"; exit 1; }
          [[ "$ACTUAL" =~ ^[0-9a-f]{40}$ && "$ACTUAL" = "$EXPECTED" ]] || { echo "::error::Production version changed; postdeploy migrations are blocked"; exit 1; }
          [[ "${EXPECTED_DEPLOYMENT_ID:-}" =~ ^dpl_[A-Za-z0-9]+$ && "$DEPLOYMENT_ID" = "$EXPECTED_DEPLOYMENT_ID" ]] || { echo "::error::Production deployment identity changed; postdeploy migrations are blocked"; exit 1; }
          node scripts/run-production-migration-phase.mjs postdeploy

  # Gap #3 (RULEBOOK D6/D7/D8): watch RUNTIME health for 15 min after the deploy;
  # identity ambiguity requires an incident and the documented manual response.
  # Scope is runtime only: it never reads migration drift (Verify
  # Production / deploy-health sha_parity), so the known drift issue cannot roll back a release.
  # The concurrency group above serializes the next deploy behind this window.
  post_deploy_watch:
    name: Post-deploy watch and incident
    runs-on: ubuntu-latest
    needs: [deploy, postdeploy_verify]
    if: ${{ always() && needs.deploy.result != 'skipped' }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Watch production runtime health (15 min)
        id: watch
        continue-on-error: true
        env:
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ needs.deploy.outputs.deployment_id }}
          WATCH_MINUTES: "15"
        run: node scripts/post-deploy-watch.mjs

      - name: Open incident issue
        if: ${{ steps.watch.outputs.verdict == 'sustained_failure' || steps.watch.outputs.verdict == 'identity_unverified' || steps.watch.outputs.verdict == 'superseded' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ steps.watch.outputs.failed }}
          VERDICT: ${{ steps.watch.outputs.verdict }}
        run: |
          set -euo pipefail
          TITLE="Incident: production deployment requires review after ${SHA:0:7}"
          cat >body.md <<MD
          Post-deploy watch reported \`${VERDICT}\` for expected commit \`${SHA}\`.

          - failing probes (name:HTTP status): \`${FAILED}\`
          - automatic rollback: not attempted because deployment identity cannot be fenced
          - run: ${RUN_URL}

          Per RULEBOOK D7/D8 stop further releases. Immediately follow the identity-aware manual response in
          docs/plans/2026-11-deploy-before-postdeploy.md; do not assume a timed-out rollback failed. Database migrations are not reverted.

          **After a rollback Vercel stops auto-assigning the production domain.** Pushes to main will NOT go live until a
          deployment is promoted manually. Once the fix is merged and its deployment is READY, promote it:
          \`npx vercel promote <deployment-url> --token "\$VERCEL_TOKEN"\` (or Vercel dashboard > Deployments > Promote to Production),
          then confirm \`/api/version\` shows the fixed SHA. See docs/RUNBOOK.md "Post-deploy watch".
          Migration drift (Verify Production) is a separate issue and is not part of this watch.
          MD
          EXISTING=$(gh issue list --state open --search "Incident: production deployment requires review in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: Fail the run after a sustained failure
        if: ${{ steps.watch.outputs.verdict == 'sustained_failure' }}
        run: |
          echo "::error::Sustained runtime failure; immediate identity-aware manual response required"
          exit 1

      - name: Fail the run if deployment identity is unknown or superseded
        if: ${{ steps.watch.outputs.verdict == 'identity_unverified' || steps.watch.outputs.verdict == 'superseded' }}
        run: |
          echo "::error::Production deployment identity is unknown or superseded; operator review required"
          exit 1

      - name: Fail the run if the watch itself errored
        if: ${{ steps.watch.outcome == 'failure' && steps.watch.outputs.verdict == '' }}
        run: |
          echo "::error::post-deploy watch crashed before reaching a verdict"
          exit 1

  # One-use alternative. A matching tree does not establish DB/REST identity,
  # writer exclusion, rollback access or compatibility; the hard stop remains.
  code_only_release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_mode == 'priority-code-only' }}
    name: Priority code-only deployment
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      issues: write
    steps:
      - name: Stop until release hold and rollback readiness are resolved
        run: |
          echo "::error::Release remains blocked pending independent resolution of the existing stop-line and rollback prerequisites"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned release CLI without credentials or lifecycle scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sunrise-vercel-cli"
          cp scripts/release-cli/package.json scripts/release-cli/package-lock.json "$RUNNER_TEMP/sunrise-vercel-cli/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/sunrise-vercel-cli"
          "$RUNNER_TEMP/sunrise-vercel-cli/node_modules/.bin/vercel" --version
      - name: Reject forced activation
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy || false }}
        run: |
          set -euo pipefail
          [ "${FORCE_DEPLOY:-false}" != true ] || { echo "::error::forced activation is not supported"; exit 1; }
      - name: Verify source, stage, verify, promote or roll back
        id: priority_release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_o4vau0vkVyakLaNFPmhXkL5M
          VERCEL_PROJECT_ID: prj_5swHVn2nqzrZ50VYx1zoEXZAvKiP
          VERCEL_CLI: ${{ runner.temp }}/sunrise-vercel-cli/node_modules/.bin/vercel
          REVIEWED_TREE_SHA: ${{ inputs.reviewed_tree }}
          RELEASE_INCIDENT_PATH: ${{ runner.temp }}/sunrise-priority-release-incident.json
        run: python3 -B scripts/priority-release.py
      - name: Upload release incident evidence
        if: ${{ always() && steps.priority_release.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: priority-release-incident-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sunrise-priority-release-incident.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Record release incident
        if: ${{ always() && steps.priority_release.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_PATH: ${{ runner.temp }}/sunrise-priority-release-incident.json
        run: |
          set -euo pipefail
          [ -s "$INCIDENT_PATH" ] || exit 0
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          TITLE="Incident: priority release requires immediate investigation ${GITHUB_SHA:0:7}"
          printf '%s\n' 'Staging, promotion, or rollback did not complete cleanly. Investigate the production deployment and the recorded incident artifact immediately; do not blindly retry.' > "$RUNNER_TEMP/sunrise-priority-incident.md"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$RUNNER_TEMP/sunrise-priority-incident.md"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/sunrise-priority-incident.md"
          fi
