name: Autonomous Engineering Loop

on:
  schedule:
    # Every 6 hours — unattended wake-up
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: run | canary | gha-canary | resume
        required: false
        default: run
      continue:
        description: Chain next iteration if work remains (true/false)
        required: false
        default: "false"
  workflow_run:
    workflows: ["CI", "Autonomous Engineering Loop", "Verify Production"]
    types: [completed]

# One loop at a time; do not cancel in-flight
concurrency:
  group: autonomous-engineering-loop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  autonomous-iteration:
    name: Run one bounded iteration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Probe capabilities (audit)
        id: caps
        run: |
          bash scripts/orchestrator/capabilities.sh | tee /tmp/caps.json
          echo "codex_auth=$(jq -r '.codex.authenticated' orchestrator/capabilities.json)" >> "$GITHUB_OUTPUT"
          echo "vercel=$(jq -r '.vercel.deploy' orchestrator/capabilities.json)" >> "$GITHUB_OUTPUT"

      - name: Run autonomous loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PROD_URL: https://sunrise-cafe-six.vercel.app
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MAX_CI_WAIT_SEC: "1200"
          DEPLOY_WAIT_SEC: "300"
          CI_FIX_ATTEMPTS: "1"
        run: |
          MODE="${{ github.event.inputs.mode || 'run' }}"
          # Scheduled runs use gha-canary for unattended proof
          if [[ "${{ github.event_name }}" == "schedule" && "$MODE" == "run" ]]; then
            MODE="gha-canary"
          fi
          bash scripts/orchestrator/loop.sh "$MODE"
        continue-on-error: true
        id: loop

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-evidence-${{ github.run_id }}
          path: |
            orchestrator/autonomy-evidence.jsonl
            orchestrator/capabilities.json
            orchestrator/discovered-work.json
            orchestrator/state.json
            orchestrator/lease.json
            orchestrator/priority.json
            docs/AUTONOMY_STATUS.md
          retention-days: 90

      - name: Chain next iteration (optional)
        if: >-
          steps.loop.outcome == 'success' &&
          (github.event.inputs.continue == 'true' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run cto:orchestrator >/dev/null
          TASK=$(jq -r '.next_task.id // empty' orchestrator/priority.json)
          if [[ -n "$TASK" && "$TASK" != "null" ]]; then
            gh workflow run autonomous-loop.yml -f mode=run -f continue=false || \
              echo "workflow_dispatch blocked — manual continue required"
          else
            echo "Idle — no chain"
          fi

      - name: Fail job if loop failed (not idle/lease)
        if: steps.loop.outcome == 'failure'
        run: |
          echo "Loop failed — see evidence artifact"
          exit 1
