name: Agent Session Provenance

on:
  pull_request:
    branches: [main]

concurrency:
  group: agent-provenance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  provenance:
    name: Agent Session Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify provenance manifest
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bash scripts/check-agent-provenance.sh
