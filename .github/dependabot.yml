version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Major upgrades require an explicit migration plan, owner, and production
    # verification. Dependabot keeps routine patch/minor maintenance grouped
    # above without flooding the queue with breaking-change proposals.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # stripe >= 22.4 changes the pinned API version type (22.4.0 ships
      # 2026-07-29.dahlia, 22.6 ships 2026-08-26.dahlia), which fails typecheck
      # against src/lib/stripe.ts `apiVersion: "2026-06-24.dahlia"`. An API
      # version change is a payment-contract change and needs its own PR.
      # Remove this rule in that PR. (#451)
      - dependency-name: "stripe"
        versions: [">=22.4.0"]
