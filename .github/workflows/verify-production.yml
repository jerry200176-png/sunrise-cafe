# Post-merge production SHA verification
# Catches "merged to main but Vercel did not deploy" (see docs/incidents/2026-07-09-vercel-merge-deploy-gap.md)

name: Verify Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-sha:
    name: Production /api/version matches main
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Poll production version (auto-deploy on drift)
        env:
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
          EXPECTED_SHA: ${{ github.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Expected: $EXPECTED_SHA"
          DEPLOYED=0
          for i in $(seq 1 40); do
            ACTUAL=$(curl -sf "$PRODUCTION_URL/api/version" | jq -r '.commit // empty')
            echo "Attempt $i: $ACTUAL"
            if [ "$ACTUAL" = "$EXPECTED_SHA" ]; then
              echo "Production matches main HEAD."
              exit 0
            fi
            if [ "$i" -ge 3 ] && [ "$DEPLOYED" -eq 0 ] && [ -n "${VERCEL_TOKEN:-}" ]; then
              echo "SHA drift — triggering vercel deploy --prod"
              DEPLOYED=1
              bash scripts/orchestrator/deploy.sh --wait 420 || true
            fi
            sleep 30
          done
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            bash scripts/orchestrator/deploy.sh --wait 90 || true
            ACTUAL=$(curl -sf "$PRODUCTION_URL/api/version" | jq -r '.commit // empty')
            if [ "$ACTUAL" = "$EXPECTED_SHA" ]; then
              echo "Production matches main after final deploy attempt."
              exit 0
            fi
          fi
          echo "::warning::Production ($ACTUAL) ≠ main ($EXPECTED_SHA) — likely Vercel deploy quota or propagation delay; not blocking CI"
          exit 0

      - name: Smoke — auth on reservation PATCH
        env:
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            "$PRODUCTION_URL/api/reservations/00000000-0000-0000-0000-000000000099" \
            -H "Content-Type: application/json" -d '{"notes":"smoke"}')
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected 401 for unauthenticated PATCH, got $CODE"
            exit 1
          fi
          echo "PATCH without auth returns 401."

  migration-drift:
    name: Production DB migration drift (optional)
    runs-on: ubuntu-latest
    needs: verify-sha
    # secrets cannot be referenced in job-level if: — check in step instead
    if: success()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Migration drift check
        env:
          CHECK_MIGRATION_DRIFT: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL}" ]; then
            echo "Skipping migration drift — Supabase secrets not configured."
            exit 0
          fi
          bash scripts/check-migration-drift.sh
