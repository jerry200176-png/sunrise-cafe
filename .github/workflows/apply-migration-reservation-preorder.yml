name: Apply reservation-preorder migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_RESERVATION_PREORDER to run the single approved migration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apply-reservation-preorder-production
  cancel-in-progress: false

jobs:
  apply:
    name: Apply and verify reservation-preorder
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Require exact confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "APPLY_RESERVATION_PREORDER" ]

      - name: Verify deployed SHA before mutation
        env:
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL=$(curl -fsS "$PRODUCTION_URL/api/version" | jq -r '.commit // empty')
          echo "Expected main: $EXPECTED_SHA"
          echo "Production: $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED_SHA" ]

      - name: Apply exact migration and verify catalog
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f .env.vercel.prod' EXIT
          if [ -z "${SUPABASE_DB_URL:-}" ] || echo "${SUPABASE_DB_URL:-}" | grep -q '\[region\]'; then
            if [ -n "${VERCEL_TOKEN:-}" ]; then
              bash scripts/vercel-production-env.sh .env.vercel.prod >/dev/null
              for key in POSTGRES_URL POSTGRES_URL_NON_POOLING POSTGRES_PRISMA_URL SUPABASE_DB_URL DATABASE_URL DIRECT_URL; do
                val=$(grep -E "^${key}=" .env.vercel.prod 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' || true)
                if [ -n "$val" ] && ! echo "$val" | grep -q '\[region\]'; then export "$key=$val"; fi
              done
            fi
          fi
          node scripts/apply-migration-reservation-preorder.mjs
