name: Incident LINE read-only probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Production reservation and LINE evidence (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pull production-only env names and read-only database URL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          trap 'rm -f .env.vercel.prod' EXIT
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            bash scripts/vercel-production-env.sh .env.vercel.prod >/dev/null
            for key in POSTGRES_URL_NON_POOLING POSTGRES_URL SUPABASE_DB_URL DATABASE_URL; do
              val=$(grep -E "^${key}=" .env.vercel.prod 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' || true)
              if [ -z "${SUPABASE_DB_URL:-}" ] && [ -n "$val" ] && ! echo "$val" | grep -q '\[region\]'; then export "$key=$val"; fi
            done
            export SUPABASE_DB_URL="${SUPABASE_DB_URL:-${POSTGRES_URL_NON_POOLING:-${POSTGRES_URL:-${DATABASE_URL:-}}}}"
            for key in LINE_CUSTOMER_ACCESS_TOKEN LINE_CHANNEL_ACCESS_TOKEN LINE_GROUP_ID NEXT_PUBLIC_SUPABASE_URL; do
              val=$(grep -E "^${key}=" .env.vercel.prod 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' || true)
              if [ -n "$val" ]; then export "$key=$val"; fi
            done
          fi
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::No read-only production Postgres URL available"
            exit 1
          fi
          export SUPABASE_DB_URL
          node scripts/incident-line-readonly-probe.mjs
