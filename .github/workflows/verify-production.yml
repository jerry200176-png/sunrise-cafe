# Post-merge production verification (read-only for production and DB metadata)
# 1) Deploy SHA must match main (required)
# 2) Migration drift via PostgREST HTTP (required when Supabase secrets present)
# Catches "merged to main but Vercel did not deploy" (see docs/incidents/2026-07-09-vercel-merge-deploy-gap.md)
#
# This workflow MUST NOT write schema_migrations, schema, or production data.
# Case B candidates are reported for human review — never auto-reconciled here.

name: Verify Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Latest main SHA wins; older in-flight verifies may cancel (superseded revision).
concurrency:
  group: verify-production-main
  cancel-in-progress: true

jobs:
  verify-sha:
    name: Production /api/version matches main
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Poll production version
        env:
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Expected: $EXPECTED_SHA"
          ACTUAL=""
          for i in $(seq 1 40); do
            ACTUAL=$(curl -sf "$PRODUCTION_URL/api/version" | jq -r '.commit // empty' || true)
            echo "Attempt $i: $ACTUAL"
            if [ "$ACTUAL" = "$EXPECTED_SHA" ]; then
              echo "Production matches main HEAD."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Production ($ACTUAL) ≠ main ($EXPECTED_SHA) after polling. Production deploy and migrate is the sole deploy owner."
          exit 1

      - name: Smoke — auth on reservation PATCH
        env:
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            "$PRODUCTION_URL/api/reservations/00000000-0000-0000-0000-000000000099" \
            -H "Content-Type: application/json" -d '{"notes":"smoke"}')
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected 401 for unauthenticated PATCH, got $CODE"
            exit 1
          fi
          echo "PATCH without auth returns 401."

      - name: Health + reminder/outcome freshness contract
        env:
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
          CTO_OUTCOME_SECRET: ${{ secrets.CTO_OUTCOME_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          HEALTH=$(curl -sf "$PRODUCTION_URL/api/booking-health")
          echo "$HEALTH" | jq -e '.ok == true' >/dev/null
          echo "booking-health ok"
          SECRET="${CTO_OUTCOME_SECRET:-${CRON_SECRET:-}}"
          if [ -z "$SECRET" ]; then
            echo "::notice::No CTO/CRON secret — skipping authenticated CEO evidence probe"
            exit 0
          fi
          CEO=$(curl -sf -H "Authorization: Bearer $SECRET" "$PRODUCTION_URL/api/ops/ceo-evidence" || true)
          if [ -z "$CEO" ]; then
            echo "::warning::CEO evidence endpoint not yet deployed or unauthorized — non-blocking on first ship"
            exit 0
          fi
          echo "$CEO" | jq '{production, critical_jobs, risks, evidence_confidence}'
          echo "$CEO" | jq -e '.outcomes | type == "object"' >/dev/null
          echo "$CEO" | jq -e '(.outcomes | keys | length) > 0' >/dev/null
          echo "CEO evidence outcomes non-empty"

  migration-drift:
    name: Production migration drift
    runs-on: ubuntu-latest
    needs: verify-sha
    if: success()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Migration drift check (PostgREST HTTP, read-only)
        env:
          CHECK_MIGRATION_DRIFT: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "Skipping migration drift — Supabase secrets not configured."
            exit 0
          fi
          echo "::notice::Running reconcile dry-run diagnostic (read-only; not a pass criterion)"
          node scripts/reconcile-migration-ledger.mjs || true
          bash scripts/check-migration-drift.sh
      - name: PostgreSQL catalog schema probe (SELECT only)
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets[format('{0}_{1}', 'SUPABASE', 'DB_URL')] }}
        run: |
          set -euo pipefail
          if [ -z "${POSTGRES_URL_NON_POOLING:-}" ]; then
            echo "::error::a read-only Postgres connection secret is required for live schema verification"
            exit 1
          fi
          node scripts/verify-live-schema-readonly.mjs
