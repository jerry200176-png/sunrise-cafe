name: LINE Pay Vercel sandbox env (allowlisted)

on:
  pull_request:
    paths:
      - '.github/workflows/ops-linepay-vercel-env.yml'
      - 'scripts/ops-linepay-vercel-env.sh'
      - 'src/lib/ops-linepay-vercel-env.test.ts'
      - 'docs/ops/LINE_PAY_SANDBOX_ENV.md'
  workflow_dispatch:
    inputs:
      mode:
        description: "All LINE Pay environment operations are temporarily paused pending a reviewed safe path."
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - set-sandbox-url
          - restore-fixed-link

concurrency:
  group: linepay-vercel-env-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: pull_request LINE Pay workflow checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate workflow isolation
        run: npx vitest run src/lib/ops-linepay-vercel-env.test.ts

  operate:
    name: LINE Pay environment operations paused
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Explain paused operations
        run: |
          echo '::error::LINE Pay environment operations are paused until a reviewed safe path is available.'
          exit 1
