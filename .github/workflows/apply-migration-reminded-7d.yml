# Apply is_reminded_7d migration (manual / post-deploy)
# Founder: GitHub → Actions → "Apply migration is_reminded_7d" → Run workflow

name: Apply migration is_reminded_7d

on:
  workflow_dispatch:

jobs:
  paused:
    name: Migration paused — backup protection required
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Explain why migration cannot run
        run: |
          echo '::error::Migration is paused until an encrypted, retained backup and a reviewed migration path are verified.'
          exit 1

  apply:
    # Keep the legacy definition for review, but never run it without a backup gate.
    if: ${{ false }}
    name: Add reservations.is_reminded_7d
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply migration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL}" ]; then
            echo "::error::Set NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in repo Secrets"
            exit 1
          fi
          if [ -n "${SUPABASE_DB_URL}" ]; then
            node scripts/apply-migration-reminded-7d.mjs
            exit $?
          fi
          echo "SUPABASE_DB_URL not set — calling production API..."
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Add SUPABASE_DB_URL or CRON_SECRET to repo Secrets"
            exit 1
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://sunrise-cafe-six.vercel.app/api/admin/migrations/apply-reminded-7d"
