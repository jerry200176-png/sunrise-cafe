name: LINE Pay Vercel sandbox env (allowlisted)

on:
  pull_request:
    paths:
      - '.github/workflows/ops-linepay-vercel-env.yml'
      - 'scripts/ops-linepay-vercel-env.sh'
      - 'scripts/run-linepay-vercel-env-safely.sh'
      - 'scripts/sanitize-linepay-report.py'
      - 'scripts/parse-vercel-env-list.py'
      - 'src/lib/ops-linepay-vercel-env.test.ts'
      - 'src/lib/linepay-evidence-safety.test.ts'
      - 'src/lib/vercel-env-list-format.test.ts'
      - 'docs/ops/LINE_PAY_SANDBOX_ENV.md'
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect is read-only; set-sandbox-url writes sandbox host; restore-fixed-link removes sandbox/dynamic LINE Pay env"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - set-sandbox-url
          - restore-fixed-link

concurrency:
  group: linepay-vercel-env-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: pull_request LINE Pay Vercel env
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate with simulated Vercel (no production access)
        run: |
          npx vitest run src/lib/ops-linepay-vercel-env.test.ts src/lib/linepay-evidence-safety.test.ts src/lib/vercel-env-list-format.test.ts
          echo 'PR validation uses a fake Vercel CLI and does not inspect production.' >> "$GITHUB_STEP_SUMMARY"

  operate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Manual LINE Pay Vercel env
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Resolve mode
        id: scope
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          MODE="${INPUT_MODE:-inspect}"
          case "$MODE" in
            inspect|set-sandbox-url|restore-fixed-link) ;;
            *) echo "::error::mode not allowlisted"; exit 1 ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Inspect or set sandbox base URL
        id: inspect
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MODE: ${{ steps.scope.outputs.mode }}
          PROD_URL: https://sunrise-cafe-six.vercel.app
        run: |
          set -euo pipefail
          bash scripts/run-linepay-vercel-env-safely.sh
      - name: Route production activation through canonical workflow
        if: steps.scope.outputs.mode != 'inspect'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run production-deploy-migrate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo "Canonical production workflow dispatched after env operation."
      - name: Upload evidence
        if: always() && steps.inspect.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linepay-vercel-env-${{ steps.scope.outputs.mode }}-${{ github.run_id }}
          path: out/linepay-vercel-env.txt
          if-no-files-found: error
          retention-days: 30
      - name: Job summary
        if: always() && steps.inspect.outcome == 'success'
        run: |
          {
            echo '### LINE Pay Vercel env'
            echo '```text'
            cat out/linepay-vercel-env.txt 2>/dev/null || echo 'No output captured.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
