# Deploy production + apply pending DB migrations when main advances.
# Complements verify-production (SHA poll) with one immediate deploy attempt.
# deploy.sh records Vercel quota/rate-limit failures and ends without retrying;
# this keeps the sole deploy writer from burning quota in a retry loop.
# Phase order is enforced by job dependencies:
# predeploy_migrate -> predeploy_verify -> deploy -> postdeploy_migrate -> postdeploy_verify.

name: Production deploy and migrate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force a Vercel production deploy even when the source SHA is already live (used for runtime env activation)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Serialize the sole repository-controlled production deploy writer.
# Verification is intentionally read-only and never competes for Vercel quota.
concurrency:
  group: production-deploy-main
  cancel-in-progress: false

jobs:
  predeploy_migrate:
    name: Apply predeploy migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # age PUBLIC key; optional. Absent = NO retained backup (dump verified, then deleted at job end).
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install age (only when BACKUP_AGE_RECIPIENT secret exists)
        if: ${{ env.BACKUP_AGE_RECIPIENT != '' }}
        run: sudo apt-get install -y -qq --no-install-recommends age
      - name: Resolve database URL for the backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f .env.vercel.prod' EXIT
          source scripts/resolve-db-url.sh
          [ -n "${SUPABASE_DB_URL:-}" ] || { echo "::error::no database URL available: migrations will not run"; exit 1; }
          echo "::add-mask::$SUPABASE_DB_URL"
          echo "SUPABASE_DB_URL=$SUPABASE_DB_URL" >>"$GITHUB_ENV"

      # Fail-closed ordering (Gap #4): backup -> upload -> verify upload -> migrate.
      # Any failing step stops the job before the migration step starts.
      - name: Pre-migration backup (predeploy)
        id: backup
        run: bash scripts/pre-migration-backup.sh predeploy

      - name: Upload encrypted predeploy backup
        id: upload
        if: ${{ steps.backup.outputs.encrypted == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-backup-predeploy-${{ github.run_id }}
          path: |
            ${{ steps.backup.outputs.artifact_path }}
            ${{ steps.backup.outputs.manifest_path }}
          retention-days: 3
          if-no-files-found: error

      - name: Verify backup upload completed
        if: ${{ steps.backup.outputs.encrypted == 'true' }}
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          [ -n "$ARTIFACT_ID" ] || { echo "::error::backup artifact upload not confirmed: migrations will not run"; exit 1; }
          echo "backup artifact id $ARTIFACT_ID uploaded"

      - name: Apply canonical predeploy phase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f .env.vercel.prod' EXIT
          if [ -z "${SUPABASE_DB_URL:-}" ] || echo "${SUPABASE_DB_URL:-}" | grep -q '\[region\]'; then
            if [ -n "${VERCEL_TOKEN:-}" ]; then
              bash scripts/vercel-production-env.sh .env.vercel.prod
              for key in POSTGRES_URL POSTGRES_URL_NON_POOLING POSTGRES_PRISMA_URL SUPABASE_DB_URL DATABASE_URL DIRECT_URL; do
                val=$(grep -E "^${key}=" .env.vercel.prod 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' || true)
                if [ -n "$val" ] && ! echo "$val" | grep -q '\[region\]'; then export "$key=$val"; fi
              done
              if [ -z "${SUPABASE_DB_URL:-}" ] || echo "${SUPABASE_DB_URL:-}" | grep -q '\[region\]'; then
                export SUPABASE_DB_URL="${POSTGRES_URL_NON_POOLING:-${POSTGRES_URL:-${POSTGRES_PRISMA_URL:-${DATABASE_URL:-${DIRECT_URL:-}}}}}"
              fi
            fi
          fi
          node scripts/run-production-migration-phase.mjs predeploy

  predeploy_verify:
    name: Verify predeploy migrations
    runs-on: ubuntu-latest
    needs: predeploy_migrate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Re-run canonical predeploy verification
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f .env.vercel.prod' EXIT
          if [ -z "${SUPABASE_DB_URL:-}" ] || echo "${SUPABASE_DB_URL:-}" | grep -q '\[region\]'; then
            if [ -n "${VERCEL_TOKEN:-}" ]; then
              bash scripts/vercel-production-env.sh .env.vercel.prod
              for key in POSTGRES_URL POSTGRES_URL_NON_POOLING POSTGRES_PRISMA_URL SUPABASE_DB_URL DATABASE_URL DIRECT_URL; do
                val=$(grep -E "^${key}=" .env.vercel.prod 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' || true)
                if [ -n "$val" ] && ! echo "$val" | grep -q '\[region\]'; then export "$key=$val"; fi
              done
              if [ -z "${SUPABASE_DB_URL:-}" ] || echo "${SUPABASE_DB_URL:-}" | grep -q '\[region\]'; then
                export SUPABASE_DB_URL="${POSTGRES_URL_NON_POOLING:-${POSTGRES_URL:-${POSTGRES_PRISMA_URL:-${DATABASE_URL:-${DIRECT_URL:-}}}}}"
              fi
            fi
          fi
          node scripts/run-production-migration-phase.mjs predeploy

  deploy:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    needs: predeploy_verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - name: Record trusted main head for deploy-health
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/record-deploy-health-head.mjs
      - run: npm ci
      - name: Deploy if SHA drift
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
          FORCE_DEPLOY: ${{ inputs.force_deploy || false }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN unset — skip"
            exit 0
          fi
          EXPECTED="$(git rev-parse HEAD)"
          ACTUAL="$(curl -sf "$PRODUCTION_URL/api/version" | jq -r '.commit // empty')"
          echo "Force deploy: ${FORCE_DEPLOY:-false}"
          if [ "$ACTUAL" = "$EXPECTED" ] && [ "${FORCE_DEPLOY:-false}" != "true" ]; then
            echo "Production already at $EXPECTED"
            exit 0
          fi
          echo "Deploying: prod=$ACTUAL expected=$EXPECTED force=${FORCE_DEPLOY:-false}"
          bash scripts/orchestrator/deploy.sh --wait 420 || {
            echo "::warning::Deploy step did not complete — postdeploy migrations will still run"
          }

  postdeploy_migrate:
    name: Apply postdeploy migrations
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    env:
      # age PUBLIC key; optional. Absent = NO retained backup (dump verified, then deleted at job end).
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install age (only when BACKUP_AGE_RECIPIENT secret exists)
        if: ${{ env.BACKUP_AGE_RECIPIENT != '' }}
        run: sudo apt-get install -y -qq --no-install-recommends age
      - name: Resolve database URL for the backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f .env.vercel.prod' EXIT
          source scripts/resolve-db-url.sh
          [ -n "${SUPABASE_DB_URL:-}" ] || { echo "::error::no database URL available: migrations will not run"; exit 1; }
          echo "::add-mask::$SUPABASE_DB_URL"
          echo "SUPABASE_DB_URL=$SUPABASE_DB_URL" >>"$GITHUB_ENV"

      # Fail-closed ordering (Gap #4): backup -> upload -> verify upload -> migrate.
      # Any failing step stops the job before the migration step starts.
      - name: Pre-migration backup (postdeploy)
        id: backup
        run: bash scripts/pre-migration-backup.sh postdeploy

      - name: Upload encrypted postdeploy backup
        id: upload
        if: ${{ steps.backup.outputs.encrypted == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-backup-postdeploy-${{ github.run_id }}
          path: |
            ${{ steps.backup.outputs.artifact_path }}
            ${{ steps.backup.outputs.manifest_path }}
          retention-days: 3
          if-no-files-found: error

      - name: Verify backup upload completed
        if: ${{ steps.backup.outputs.encrypted == 'true' }}
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          [ -n "$ARTIFACT_ID" ] || { echo "::error::backup artifact upload not confirmed: migrations will not run"; exit 1; }
          echo "backup artifact id $ARTIFACT_ID uploaded"

      - name: Apply canonical postdeploy phase
        env:
          # Confirmed upload id; founder_approved runners refuse to migrate without it.
          BACKUP_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ] || echo "${SUPABASE_DB_URL:-}" | grep -q '\[region\]'; then
            if [ -n "${VERCEL_TOKEN:-}" ]; then
              bash scripts/vercel-production-env.sh .env.vercel.prod
              for key in POSTGRES_URL POSTGRES_URL_NON_POOLING POSTGRES_PRISMA_URL SUPABASE_DB_URL DATABASE_URL DIRECT_URL; do
                val=$(grep -E "^${key}=" .env.vercel.prod 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' || true)
                if [ -n "$val" ] && ! echo "$val" | grep -q '\[region\]'; then
                  export "$key=$val"
                fi
              done
              if [ -z "${SUPABASE_DB_URL:-}" ] || echo "${SUPABASE_DB_URL:-}" | grep -q '\[region\]'; then
                export SUPABASE_DB_URL="${POSTGRES_URL_NON_POOLING:-${POSTGRES_URL:-${POSTGRES_PRISMA_URL:-${DATABASE_URL:-${DIRECT_URL:-}}}}}"
              fi
              echo "Postgres env keys present: $(grep -E '^(POSTGRES|DATABASE|SUPABASE_DB|DIRECT)' .env.vercel.prod | cut -d= -f1 | tr '\n' ' ' || true)"
              if grep -q '^GUEST_LOOKUP_SECRET=' .env.vercel.prod 2>/dev/null; then
                echo "GUEST_LOOKUP_SECRET: configured in Vercel"
              else
                echo "GUEST_LOOKUP_SECRET: unset in Vercel (safe fallback to SESSION_SECRET active)"
              fi
            fi
          fi
          node scripts/run-production-migration-phase.mjs postdeploy

      - name: Verify ops_events
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CODE=$(curl -sS -o /tmp/ops_probe.json -w '%{http_code}' \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/ops_events?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          echo "ops_events probe: HTTP $CODE"
          [ "$CODE" = "200" ] || cat /tmp/ops_probe.json || true

      - name: Verify deploy-health Cron runtime
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f .env.vercel.prod' EXIT
          if [ -z "${CRON_SECRET:-}" ] && [ -n "${VERCEL_TOKEN:-}" ]; then
            # CRON_SECRET is intentionally a Vercel-only production secret in
            # this repo. Reuse the existing deploy credential only inside the
            # ephemeral runner; never print or persist the secret.
            bash scripts/vercel-production-env.sh .env.vercel.prod >/dev/null 2>&1
            CRON_SECRET=$(sed -n 's/^CRON_SECRET=//p' .env.vercel.prod | head -1 | sed -E 's/^"//; s/"$//')
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is unavailable for the production deploy-health probe"
            exit 1
          fi
          CODE=$(curl -sS -o /tmp/deploy_health_probe.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://sunrise-cafe-six.vercel.app/api/admin/reminders/deploy-health")
          echo "deploy-health probe: HTTP $CODE"
          jq '{ok, sha_parity, benign_drift, main, prod}' /tmp/deploy_health_probe.json
          [ "$CODE" = "200" ]
          jq -e '.ok == true and (.sha_parity == true or .benign_drift == true)' \
            /tmp/deploy_health_probe.json >/dev/null
          if grep -Fq 'Could not resolve main branch SHA' /tmp/deploy_health_probe.json; then
            echo "::error::legacy GitHub main-SHA resolution error is still present"
            exit 1
          fi

      - name: Verify market-parity columns
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for col in guest_confirmed_at deposit_urgent_reminder_sent_at; do
            CODE=$(curl -sS -o /tmp/col.json -w '%{http_code}' \
              "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/reservations?select=${col}&limit=1" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
            echo "reservations.${col}: HTTP $CODE"
            [ "$CODE" = "200" ] || cat /tmp/col.json || true
          done
          for col in staff_called_at staff_alerted_at; do
            CODE=$(curl -sS -o /tmp/col.json -w '%{http_code}' \
              "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/waitlist?select=${col}&limit=1" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
            echo "waitlist.${col}: HTTP $CODE"
            [ "$CODE" = "200" ] || cat /tmp/col.json || true
          done

      - name: Verify LINE reminder delivery ledger
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/line_ledger.json -w '%{http_code}' \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/line_reminder_deliveries?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          echo "line_reminder_deliveries probe: HTTP $CODE"
          [ "$CODE" = "200" ] || { cat /tmp/line_ledger.json || true; exit 1; }
          RPC_CODE=$(curl -sS -o /tmp/line_claim.json -w '%{http_code}' \
            -X POST "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/rpc/claim_line_reminder_delivery" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"p_reminder_type":"d1_group","p_reminder_date":"2099-01-01","p_reservation_id":"00000000-0000-4000-8000-000000000000","p_recipient_type":"group","p_recipient_id":"ledger-probe"}')
          echo "claim_line_reminder_delivery probe: HTTP $RPC_CODE"
          if grep -Eiq 'PGRST202|Could not find the function' /tmp/line_claim.json; then
            cat /tmp/line_claim.json
            exit 1
          fi
          [ "$RPC_CODE" -lt 500 ]

  postdeploy_verify:
    name: Verify postdeploy migrations
    runs-on: ubuntu-latest
    needs: postdeploy_migrate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Re-run canonical postdeploy verification
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f .env.vercel.prod' EXIT
          if [ -z "${SUPABASE_DB_URL:-}" ] || echo "${SUPABASE_DB_URL:-}" | grep -q '\[region\]'; then
            if [ -n "${VERCEL_TOKEN:-}" ]; then
              bash scripts/vercel-production-env.sh .env.vercel.prod
              for key in POSTGRES_URL POSTGRES_URL_NON_POOLING POSTGRES_PRISMA_URL SUPABASE_DB_URL DATABASE_URL DIRECT_URL; do
                val=$(grep -E "^${key}=" .env.vercel.prod 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' || true)
                if [ -n "$val" ] && ! echo "$val" | grep -q '\[region\]'; then export "$key=$val"; fi
              done
              if [ -z "${SUPABASE_DB_URL:-}" ] || echo "${SUPABASE_DB_URL:-}" | grep -q '\[region\]'; then
                export SUPABASE_DB_URL="${POSTGRES_URL_NON_POOLING:-${POSTGRES_URL:-${POSTGRES_PRISMA_URL:-${DATABASE_URL:-${DIRECT_URL:-}}}}}"
              fi
            fi
          fi
          node scripts/run-production-migration-phase.mjs postdeploy

  # Gap #3 (RULEBOOK D6/D7/D8): watch RUNTIME health for 15 min after the deploy; on
  # sustained failure roll back to the previous production deployment and open an
  # incident issue. Scope is runtime only: it never reads migration drift (Verify
  # Production / deploy-health sha_parity), so the known drift issue cannot roll back a release.
  # The concurrency group above serializes the next deploy behind this window.
  post_deploy_watch:
    name: Post-deploy watch and auto-rollback
    runs-on: ubuntu-latest
    needs: [deploy, postdeploy_verify]
    if: ${{ always() && needs.deploy.result == 'success' }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Watch production runtime health (15 min)
        id: watch
        continue-on-error: true
        env:
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
          EXPECTED_SHA: ${{ github.sha }}
          WATCH_MINUTES: "15"
        run: node scripts/post-deploy-watch.mjs

      - name: Roll back to the previous production deployment
        id: rollback
        if: ${{ steps.watch.outputs.verdict == 'sustained_failure' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
          BAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN unset: cannot roll back automatically (run docs/RUNBOOK.md rollback)"
            echo "result=no_token" >>"$GITHUB_OUTPUT"; exit 0
          fi
          [ -f .vercel/project.json ] || npx vercel link --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          if ! npx vercel rollback --yes --token "$VERCEL_TOKEN"; then
            echo "result=rollback_command_failed" >>"$GITHUB_OUTPUT"; exit 0
          fi
          for i in $(seq 1 20); do
            V=$(curl -sf "$PRODUCTION_URL/api/version" | jq -r '.commit // empty' || true)
            H=$(curl -sf "$PRODUCTION_URL/api/booking-health" | jq -r '.ok // empty' || true)
            echo "rollback verify $i: commit=${V:0:7} health=$H"
            if [ -n "$V" ] && [ "$V" != "$BAD_SHA" ] && [ "$H" = "true" ]; then
              echo "result=rolled_back" >>"$GITHUB_OUTPUT"; echo "now_serving=${V:0:7}" >>"$GITHUB_OUTPUT"; exit 0
            fi
            sleep 15
          done
          echo "result=rollback_unverified" >>"$GITHUB_OUTPUT"

      - name: Open incident issue
        if: ${{ steps.watch.outputs.verdict == 'sustained_failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ steps.watch.outputs.failed }}
          ROLLBACK: ${{ steps.rollback.outputs.result }}
          NOW_SERVING: ${{ steps.rollback.outputs.now_serving }}
        run: |
          set -euo pipefail
          TITLE="Incident: production runtime health failed after deploy ${SHA:0:7}"
          cat >body.md <<MD
          Post-deploy watch saw sustained runtime failures after deploying \`${SHA}\`.

          - failing probes (name:HTTP status): \`${FAILED}\`
          - automatic rollback result: \`${ROLLBACK:-not_attempted}\` (now serving: \`${NOW_SERVING:-unknown}\`)
          - run: ${RUN_URL}

          Per RULEBOOK D8 stop further releases to production until this is fixed. If the rollback result is not
          \`rolled_back\`, run the rollback in docs/RUNBOOK.md now. Database migrations are additive and are not reverted.

          **After a rollback Vercel stops auto-assigning the production domain.** Pushes to main will NOT go live until a
          deployment is promoted manually. Once the fix is merged and its deployment is READY, promote it:
          \`npx vercel promote <deployment-url> --token "\$VERCEL_TOKEN"\` (or Vercel dashboard > Deployments > Promote to Production),
          then confirm \`/api/version\` shows the fixed SHA. See docs/RUNBOOK.md "Post-deploy watch".
          Migration drift (Verify Production) is a separate issue and is not part of this watch.
          MD
          EXISTING=$(gh issue list --state open --search "Incident: production runtime health failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: Fail the run after a sustained failure
        if: ${{ steps.watch.outputs.verdict == 'sustained_failure' }}
        run: |
          echo "::error::Sustained runtime failure after deploy; rollback result: ${{ steps.rollback.outputs.result }}"
          exit 1

      - name: Fail the run if the watch itself errored
        if: ${{ steps.watch.outcome == 'failure' && steps.watch.outputs.verdict == '' }}
        run: |
          echo "::error::post-deploy watch crashed before reaching a verdict"
          exit 1
