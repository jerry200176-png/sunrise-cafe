# Backup trigger for tomorrow LINE reminders if Vercel Hobby cron is late/missed.
# Primary: Vercel cron UTC 12:00 (TW 20:00–20:59). This runs UTC 13:10 (TW 21:10).
# CRON_SECRET is Vercel-only by design; pull via VERCEL_TOKEN when the GH secret is unset.
name: Send-line reminder backup

on:
  schedule:
    - cron: "10 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: send-line-reminder-backup
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger send-line + verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Resolve CRON_SECRET + run send-line twice + verify
        env:
          PROD_URL: https://sunrise-cafe-six.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ] && [ -n "${VERCEL_TOKEN:-}" ]; then
            npm ci --ignore-scripts >/dev/null
            bash scripts/vercel-production-env.sh .env.vercel.prod >/dev/null
            CRON_SECRET=$(sed -n 's/^CRON_SECRET=//p' .env.vercel.prod | head -1 | sed -E 's/^"//; s/"$//')
            export CRON_SECRET
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET unavailable (GitHub secret empty and Vercel pull failed)"
            exit 1
          fi

          call_send_line() {
            local out="$1"
            curl -sS -o "$out" -w "%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "x-reminder-trigger: github" \
              "${PROD_URL}/api/admin/reminders/send-line"
          }

          CODE1=$(call_send_line /tmp/send-line-1.json)
          echo "GET send-line #1 → HTTP ${CODE1}"
          head -c 1200 /tmp/send-line-1.json; echo
          [ "$CODE1" = "200" ] || { echo "::error::send-line #1 failed"; exit 1; }
          if grep -Fqi 'ledger unavailable' /tmp/send-line-1.json; then
            echo "::error::ledger still unavailable on #1"
            exit 1
          fi
          RESULT1=$(jq -r '.result // .meta.result // empty' /tmp/send-line-1.json 2>/dev/null || true)
          echo "result_1=${RESULT1}"

          CODE2=$(call_send_line /tmp/send-line-2.json)
          echo "GET send-line #2 → HTTP ${CODE2}"
          head -c 1200 /tmp/send-line-2.json; echo
          [ "$CODE2" = "200" ] || { echo "::error::send-line #2 failed"; exit 1; }
          if grep -Fqi 'ledger unavailable' /tmp/send-line-2.json; then
            echo "::error::ledger unavailable on #2"
            exit 1
          fi
          RESULT2=$(jq -r '.result // .meta.result // empty' /tmp/send-line-2.json 2>/dev/null || true)
          echo "result_2=${RESULT2}"
          case "$RESULT2" in
            duplicate_skip|already_notified|sent|partial|empty_cat|schedule_window_skip|"")
              echo "idempotency ok (result_2=${RESULT2:-absent})"
              ;;
            error)
              echo "::error::second run returned error"
              exit 1
              ;;
            *)
              echo "::warning::unexpected second result=${RESULT2}"
              ;;
          esac

          VERIFY_CODE=$(curl -sS -o /tmp/verify.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${PROD_URL}/api/admin/reminders/verify")
          echo "GET verify → HTTP ${VERIFY_CODE}"
          [ "$VERIFY_CODE" = "200" ] || { echo "::error::verify request failed"; exit 1; }
          jq -e 'type == "object" and .ok == true' /tmp/verify.json >/dev/null || {
            echo "::error::verify response did not confirm success"; exit 1;
          }
          if grep -Fqi 'ledger unavailable' /tmp/verify.json; then
            echo "::error::verify still reports ledger unavailable"
            exit 1
          fi
