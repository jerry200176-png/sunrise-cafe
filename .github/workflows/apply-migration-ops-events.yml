name: Verify ops_events readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supabase/migration-ops-events.sql
      - scripts/apply-migration-ops-events.mjs
      - src/lib/ops-events-readiness.mjs
      - src/lib/bootstrap-migrations.ts

jobs:
  apply:
    name: Verify ops_events REST visibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Verify without applying SQL
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/apply-migration-ops-events.mjs
