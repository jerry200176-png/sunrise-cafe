name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    # Repo default workflow token permissions are read-only, so gitleaks-action's
    # unconditional "GET .../pulls/{number}/commits" call (it runs before the
    # GITLEAKS_ENABLE_COMMENTS check, to compute the diff range to scan) was
    # failing with "Resource not accessible by integration" for every PR, not
    # just Dependabot's. pull-requests: read is what that call needs.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rulebook pin, adapters and retired rule text
        run: python3 scripts/check-rulebook.py

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: TypeScript typecheck (advisory while baseline burns down)
        run: npm run typecheck
        continue-on-error: true

      - name: TypeScript baseline regression gate
        run: npm run typecheck:baseline

      - name: Verify migration artifacts
        run: npm run verify:migrations

      - name: Verify production workflow contract
        run: npm run verify:production-workflow

      # Advisory only — high-noise transitive advisories must not be a merge gate until fail-closed baseline exists.
      - name: npm audit (high+) [advisory]
        run: npm audit --audit-level=high
        continue-on-error: true

      # Fail-closed secret scan — required for merge safety (do not continue-on-error).
      # GITLEAKS_ENABLE_COMMENTS=false skips the PR-review-comment API call
      # entirely (belt-and-suspenders on top of the job's `permissions:`
      # above); the scan itself needs no token permissions at all.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Build
        run: npm run build
        env:
          # 提供 build 所需的 placeholder 環境變數
          # 不含真實密鑰：API routes 在 runtime 才執行，build 階段不需要真實值
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
          ADMIN_PASSWORD: placeholder_password
          # Sentry/Upstash 未設定時自動停用，不影響 build

  e2e-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
          ADMIN_PASSWORD: placeholder_password
      - run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          # Required for /admin page middleware under `next start` (signed session in e2e helpers)
          ADMIN_PASSWORD: placeholder_password
          SESSION_SECRET: placeholder_password
          # Optional: set repo secret E2E_ADMIN_PASSWORD to enable live admin payment smoke (CG-007)
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
