name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    # Repo default workflow token permissions are read-only, so gitleaks-action's
    # unconditional "GET .../pulls/{number}/commits" call (it runs before the
    # GITLEAKS_ENABLE_COMMENTS check, to compute the diff range to scan) was
    # failing with "Resource not accessible by integration" for every PR, not
    # just Dependabot's. pull-requests: read is what that call needs.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rulebook pin, adapters and retired rule text
        run: python3 scripts/check-rulebook.py

      - name: Priority release safeguards (synthetic providers only)
        run: python3 -B scripts/test-priority-release.py

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: TypeScript baseline regression gate
        run: npm run typecheck:baseline

      - name: Verify migration artifacts
        run: npm run verify:migrations

      - name: Verify production workflow contract
        run: npm run verify:production-workflow

      # Additive-only SQL gate (RULEBOOK F1, docs/MIGRATIONS.md). Plan check runs
      # always; the diff lint runs on PRs and reads the label live so a re-run
      # after the Founder adds `founder-approved-sql` sees it.
      - name: Production migration plan gate
        run: node scripts/run-production-migration-phase.mjs --check

      - name: Additive-only SQL gate (PR diff)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name' | grep -qx 'founder-approved-sql'; then
            export FOUNDER_APPROVED_SQL=true
          fi
          node scripts/check-additive-sql.mjs --base "origin/${{ github.base_ref }}"

      # Blocking for high/critical (Gap #8). False positives go in .github/audit-allowlist.json
      # with a reason and an expiry; expired entries fail again.
      - name: npm audit (high+) [blocking]
        run: node scripts/npm-audit-gate.mjs

      - name: Actions pinned to commit SHAs
        run: node scripts/check-actions-pinned.mjs

      # Fail-closed secret scan — required for merge safety (do not continue-on-error).
      # GITLEAKS_ENABLE_COMMENTS=false skips the PR-review-comment API call
      # entirely (belt-and-suspenders on top of the job's `permissions:`
      # above); the scan itself needs no token permissions at all.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Build
        run: npm run build
        env:
          # 提供 build 所需的 placeholder 環境變數
          # 不含真實密鑰：API routes 在 runtime 才執行，build 階段不需要真實值
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
          ADMIN_PASSWORD: placeholder_password
          # Sentry/Upstash 未設定時自動停用，不影響 build

  release-cli-contract:
    name: Release CLI offline contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify locked CLI in bounded rootless sandboxes
        run: |
          set -euo pipefail
          command -v bwrap >/dev/null || { echo '::error::rootless sandbox unavailable'; exit 1; }
          NODE_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          umask 077
          mkdir -p "$RUNNER_TEMP/sunrise-vercel-input"
          bash scripts/verified-release-cli-blobs.sh "$RUNNER_TEMP/sunrise-vercel-input"
          printf 'sandbox:x:%s:%s:Sandbox:/tmp/sandbox-home:/bin/sh\n' "$(id -u)" "$(id -g)" > "$RUNNER_TEMP/sunrise-sandbox-passwd"
          # Install with network only inside a bounded tmpfs. No checkout,
          # credential, runner home, host socket or host process tree is mounted.
          set +e
          timeout 240s bwrap --unshare-user --unshare-pid --unshare-ipc --unshare-uts --die-with-parent --clearenv \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --dir /sandbox --ro-bind "$NODE_ROOT" /sandbox/node --size 1073741824 --tmpfs /sandbox/cli \
            --ro-bind "$RUNNER_TEMP/sunrise-vercel-input/package.json" /sandbox/cli/package.json \
            --ro-bind "$RUNNER_TEMP/sunrise-vercel-input/package-lock.json" /sandbox/cli/package-lock.json \
            --dir /etc --ro-bind "$RUNNER_TEMP/sunrise-sandbox-passwd" /etc/passwd --dir /etc/ssl --ro-bind /etc/ssl/certs /etc/ssl/certs \
            --ro-bind /etc/resolv.conf /etc/resolv.conf --ro-bind /etc/hosts /etc/hosts \
            --proc /proc --dev /dev --size 1073741824 --tmpfs /tmp --chdir /tmp \
            --setenv PATH /sandbox/node/bin:/usr/bin:/bin --setenv NPM_CONFIG_CACHE /tmp/npm-cache \
            --setenv NPM_CONFIG_USERCONFIG /tmp/user.npmrc --setenv NPM_CONFIG_GLOBALCONFIG /tmp/global.npmrc \
            --setenv DO_NOT_TRACK 1 --setenv VERCEL_TELEMETRY_DISABLED 1 \
            /bin/sh -c '
              set -eu
              ulimit -f 262144
              mkdir -p /tmp/sandbox-home
              : > /tmp/user.npmrc; : > /tmp/global.npmrc
              /sandbox/node/bin/npm config get registry >/dev/null
              /sandbox/node/bin/npm ci --ignore-scripts --no-audit --no-fund --prefix /sandbox/cli
              offline_help() {
                output=$1; shift
                code=0
                timeout 20s bwrap --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts --die-with-parent --clearenv \
                  --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
                  --dir /sandbox --ro-bind /sandbox/node /sandbox/node --ro-bind /sandbox/cli /sandbox/cli \
                  --dir /etc --ro-bind /etc/passwd /etc/passwd --proc /proc --dev /dev --size 16777216 --tmpfs /tmp --chdir /tmp \
                  --setenv PATH /sandbox/node/bin:/usr/bin:/bin --setenv DO_NOT_TRACK 1 --setenv VERCEL_TELEMETRY_DISABLED 1 \
                  /bin/sh -c "mkdir -p /tmp/sandbox-home; exec /sandbox/cli/node_modules/.bin/vercel \"\$@\"" sh "$@" >"$output" 2>&1 || code=$?
                [ "$code" = 0 ] || [ "$code" = 2 ] || { tail -c 8192 "$output"; echo offline-help-failed; return 1; }
              }
              require_flag() {
                grep -q -- "$1" "$2" || { tail -c 8192 "$2"; echo documented-flag-missing; return 1; }
              }
              offline_help /tmp/version.txt --version
              grep -Fxq -- "65.9.0" /tmp/version.txt || { tail -c 8192 /tmp/version.txt; echo wrong-cli-version; exit 1; }
              offline_help /tmp/deploy.txt --scope synthetic-team deploy --help
              require_flag --skip-domain /tmp/deploy.txt
              require_flag --prod /tmp/deploy.txt
              require_flag --build-env /tmp/deploy.txt
              require_flag --env /tmp/deploy.txt
              offline_help /tmp/promote.txt --scope synthetic-team promote --help
              require_flag --yes /tmp/promote.txt
              offline_help /tmp/rollback.txt --scope synthetic-team rollback --help
              require_flag --yes /tmp/rollback.txt
              /sandbox/node/bin/npm audit --omit=dev --audit-level=high --prefix /sandbox/cli
            ' 2>&1 | head -c 262144 > "$RUNNER_TEMP/vercel-install-output.txt"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != 0 ]; then
            python3 -B scripts/sanitize-sandbox-log.py "$RUNNER_TEMP/vercel-install-output.txt"
            echo '::error::sandboxed CLI contract or audit failed'
            exit 1
          fi

  e2e-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
          ADMIN_PASSWORD: placeholder_password
      - run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          # Required for /admin page middleware under `next start` (signed session in e2e helpers)
          ADMIN_PASSWORD: placeholder_password
          SESSION_SECRET: placeholder_password
          # Optional: set repo secret E2E_ADMIN_PASSWORD to enable live admin payment smoke (CG-007)
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
