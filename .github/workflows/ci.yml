name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    # Repo default workflow token permissions are read-only, so gitleaks-action's
    # unconditional "GET .../pulls/{number}/commits" call (it runs before the
    # GITLEAKS_ENABLE_COMMENTS check, to compute the diff range to scan) was
    # failing with "Resource not accessible by integration" for every PR, not
    # just Dependabot's. pull-requests: read is what that call needs.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rulebook pin, adapters and retired rule text
        run: python3 scripts/check-rulebook.py

      - name: Priority release safeguards (synthetic providers only)
        run: python3 -B scripts/test-priority-release.py

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: TypeScript baseline regression gate
        run: npm run typecheck:baseline

      - name: Verify migration artifacts
        run: npm run verify:migrations

      - name: Verify production workflow contract
        run: npm run verify:production-workflow

      # Additive-only SQL gate (RULEBOOK F1, docs/MIGRATIONS.md). Plan check runs
      # always; the diff lint runs on PRs and reads the label live so a re-run
      # after the Founder adds `founder-approved-sql` sees it.
      - name: Production migration plan gate
        run: node scripts/run-production-migration-phase.mjs --check

      - name: Additive-only SQL gate (PR diff)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name' | grep -qx 'founder-approved-sql'; then
            export FOUNDER_APPROVED_SQL=true
          fi
          node scripts/check-additive-sql.mjs --base "origin/${{ github.base_ref }}"

      # Blocking for high/critical (Gap #8). False positives go in .github/audit-allowlist.json
      # with a reason and an expiry; expired entries fail again.
      - name: npm audit (high+) [blocking]
        run: node scripts/npm-audit-gate.mjs

      - name: Actions pinned to commit SHAs
        run: node scripts/check-actions-pinned.mjs

      # Fail-closed secret scan — required for merge safety (do not continue-on-error).
      # GITLEAKS_ENABLE_COMMENTS=false skips the PR-review-comment API call
      # entirely (belt-and-suspenders on top of the job's `permissions:`
      # above); the scan itself needs no token permissions at all.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Build
        run: npm run build
        env:
          # 提供 build 所需的 placeholder 環境變數
          # 不含真實密鑰：API routes 在 runtime 才執行，build 階段不需要真實值
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
          ADMIN_PASSWORD: placeholder_password
          # Sentry/Upstash 未設定時自動停用，不影響 build

  release-cli-contract:
    name: Release CLI offline contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Check isolated npm configuration without network
        run: |
          set -euo pipefail
          command -v bwrap >/dev/null || { echo '::error::rootless sandbox unavailable'; exit 1; }
          NODE_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          umask 077
          printf 'sandbox:x:%s:%s:Sandbox:/tmp/sandbox-home:/bin/sh\n' "$(id -u)" "$(id -g)" > "$RUNNER_TEMP/sunrise-sandbox-passwd"
          bwrap --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts --die-with-parent --clearenv \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --dir /sandbox --ro-bind "$NODE_ROOT" /sandbox/node --dir /etc --ro-bind "$RUNNER_TEMP/sunrise-sandbox-passwd" /etc/passwd \
            --proc /proc --dev /dev --tmpfs /tmp --chdir /tmp \
            --setenv PATH /sandbox/node/bin:/usr/bin:/bin --setenv NPM_CONFIG_CACHE /tmp/npm-cache \
            /bin/sh -c '
              set -e
              mkdir -p /tmp/sandbox-home
              : > /tmp/shared.npmrc; : > /tmp/user.npmrc; : > /tmp/global.npmrc
              if NPM_CONFIG_USERCONFIG=/tmp/shared.npmrc NPM_CONFIG_GLOBALCONFIG=/tmp/shared.npmrc npm config get registry >/dev/null 2>&1; then exit 1; fi
              NPM_CONFIG_USERCONFIG=/tmp/user.npmrc NPM_CONFIG_GLOBALCONFIG=/tmp/global.npmrc npm config get registry >/dev/null
            '
      - name: Install locked CLI without lifecycle scripts or secrets
        run: |
          set -euo pipefail
          command -v bwrap >/dev/null || { echo '::error::rootless sandbox unavailable'; exit 1; }
          NODE_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          mkdir -p "$RUNNER_TEMP/sunrise-vercel-cli"
          # Read exact regular blobs from HEAD rather than following any PR
          # working-tree symlink. Reject unexpected modes and oversized inputs.
          bash scripts/verified-release-cli-blobs.sh "$RUNNER_TEMP/sunrise-vercel-cli"
          # Only public lockfiles and this job-owned install directory are
          # mounted. No checkout, home, runner process tree, or host sockets.
          set +e
          timeout 180s bwrap --unshare-user --unshare-pid --unshare-ipc --unshare-uts --die-with-parent --clearenv \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --dir /sandbox --ro-bind "$NODE_ROOT" /sandbox/node --bind "$RUNNER_TEMP/sunrise-vercel-cli" /sandbox/cli \
            --dir /etc --ro-bind "$RUNNER_TEMP/sunrise-sandbox-passwd" /etc/passwd --dir /etc/ssl --ro-bind /etc/ssl/certs /etc/ssl/certs \
            --ro-bind /etc/resolv.conf /etc/resolv.conf --ro-bind /etc/hosts /etc/hosts \
            --proc /proc --dev /dev --tmpfs /tmp --chdir /tmp \
            --setenv PATH /sandbox/node/bin:/usr/bin:/bin --setenv NPM_CONFIG_CACHE /tmp/npm-cache \
            --setenv NPM_CONFIG_USERCONFIG /tmp/user.npmrc --setenv NPM_CONFIG_GLOBALCONFIG /tmp/global.npmrc \
            --setenv DO_NOT_TRACK 1 --setenv VERCEL_TELEMETRY_DISABLED 1 \
            /bin/sh -c 'set -e; ulimit -f 65536; mkdir -p /tmp/sandbox-home; : > /tmp/user.npmrc; : > /tmp/global.npmrc; /sandbox/node/bin/npm config get registry >/dev/null; exec /sandbox/node/bin/npm ci --ignore-scripts --no-audit --no-fund --prefix /sandbox/cli' \
            2>&1 | head -c 262144 > "$RUNNER_TEMP/vercel-install-output.txt"
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" = 0 ] || { echo '::error::sandboxed CLI install failed or timed out'; exit 1; }
      - name: Check version and command flags without network or credentials
        run: |
          set -euo pipefail
          NODE_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          offline_help() {
            local output="$1"; shift
            local code=0
            set +e
            timeout 20s bwrap --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts --die-with-parent --clearenv \
              --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
              --dir /sandbox --ro-bind "$NODE_ROOT" /sandbox/node --ro-bind "$RUNNER_TEMP/sunrise-vercel-cli" /sandbox/cli \
              --dir /etc --ro-bind "$RUNNER_TEMP/sunrise-sandbox-passwd" /etc/passwd \
              --proc /proc --dev /dev --tmpfs /tmp --chdir /tmp \
              --setenv PATH /sandbox/node/bin:/usr/bin:/bin --setenv DO_NOT_TRACK 1 --setenv VERCEL_TELEMETRY_DISABLED 1 \
              /bin/sh -c 'mkdir -p /tmp/sandbox-home; exec /sandbox/cli/node_modules/.bin/vercel "$@"' sh "$@" \
              2>&1 | head -c 262144 > "$output"
            code=${PIPESTATUS[0]}
            set -e
            [ "$code" = 0 ] || [ "$code" = 2 ] || { echo '::error::offline CLI help failed'; return 1; }
          }
          offline_help "$RUNNER_TEMP/vercel-version.txt" --version
          grep -q '65\.9\.0' "$RUNNER_TEMP/vercel-version.txt"
          offline_help "$RUNNER_TEMP/vercel-deploy-help.txt" --scope synthetic-team deploy --help
          grep -q -- '--skip-domain' "$RUNNER_TEMP/vercel-deploy-help.txt"
          grep -q -- '--prod' "$RUNNER_TEMP/vercel-deploy-help.txt"
          grep -q -- '--build-env' "$RUNNER_TEMP/vercel-deploy-help.txt"
          grep -q -- '--env' "$RUNNER_TEMP/vercel-deploy-help.txt"
          offline_help "$RUNNER_TEMP/vercel-promote-help.txt" --scope synthetic-team promote --help
          grep -q -- '--yes' "$RUNNER_TEMP/vercel-promote-help.txt"
          offline_help "$RUNNER_TEMP/vercel-rollback-help.txt" --scope synthetic-team rollback --help
          grep -q -- '--yes' "$RUNNER_TEMP/vercel-rollback-help.txt"
      - name: Audit release CLI dependencies before any credentialed use
        run: |
          set -o pipefail
          NODE_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v node)")")")"
          set +e
          timeout 90s bwrap --unshare-user --unshare-pid --unshare-ipc --unshare-uts --die-with-parent --clearenv \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --dir /sandbox --ro-bind "$NODE_ROOT" /sandbox/node --ro-bind "$RUNNER_TEMP/sunrise-vercel-cli" /sandbox/cli \
            --dir /etc --ro-bind "$RUNNER_TEMP/sunrise-sandbox-passwd" /etc/passwd --dir /etc/ssl --ro-bind /etc/ssl/certs /etc/ssl/certs \
            --ro-bind /etc/resolv.conf /etc/resolv.conf --ro-bind /etc/hosts /etc/hosts \
            --proc /proc --dev /dev --tmpfs /tmp --chdir /tmp \
            --setenv PATH /sandbox/node/bin:/usr/bin:/bin --setenv NPM_CONFIG_CACHE /tmp/npm-cache \
            --setenv NPM_CONFIG_USERCONFIG /tmp/user.npmrc --setenv NPM_CONFIG_GLOBALCONFIG /tmp/global.npmrc \
            /bin/sh -c 'set -e; mkdir -p /tmp/sandbox-home; : > /tmp/user.npmrc; : > /tmp/global.npmrc; exec /sandbox/node/bin/npm audit --omit=dev --audit-level=high --prefix /sandbox/cli' \
            2>&1 | head -c 262144
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" = 0 ] || { echo '::error::CLI dependency audit failed or timed out'; exit 1; }

  e2e-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
          ADMIN_PASSWORD: placeholder_password
      - run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          # Required for /admin page middleware under `next start` (signed session in e2e helpers)
          ADMIN_PASSWORD: placeholder_password
          SESSION_SECRET: placeholder_password
          # Optional: set repo secret E2E_ADMIN_PASSWORD to enable live admin payment smoke (CG-007)
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
