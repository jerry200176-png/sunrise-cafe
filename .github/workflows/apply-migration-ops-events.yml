name: Apply migration ops_events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supabase/migration-ops-events.sql
      - scripts/apply-migration-ops-events.mjs

jobs:
  apply:
    name: Create ops_events table
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Apply migration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node scripts/apply-migration-ops-events.mjs || {
            echo "Script failed — trying production API fallback..."
            if [ -z "${CRON_SECRET}" ]; then
              echo "::warning::Migration will apply on next Vercel production cold start (bootstrap-migrations)"
              exit 0
            fi
            curl -sf -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://sunrise-cafe-six.vercel.app/api/admin/migrations/apply-ops-events"
          }
