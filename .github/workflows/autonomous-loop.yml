name: Autonomous Engineering Loop

on:
  schedule:
    # Every 6 hours — unattended wake-up (uses gha-canary via script default)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # No inputs — avoids GitHub Actions phantom push validation bug (actions/runner#4001)
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: autonomous-engineering-loop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  autonomous-iteration:
    name: Run one bounded iteration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Configure git identity
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Probe capabilities (audit)
        run: bash scripts/orchestrator/capabilities.sh

      - name: Run autonomous loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PROD_URL: https://sunrise-cafe-six.vercel.app
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MAX_CI_WAIT_SEC: "1200"
          DEPLOY_WAIT_SEC: "300"
          CI_FIX_ATTEMPTS: "1"
        run: |
          MODE="run"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            MODE="gha-canary"
          fi
          set +e
          bash scripts/orchestrator/loop.sh "$MODE"
          RC=$?
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          # 0=success/idle | 2=blocked (expected) | 3=lease | 4=validation fail
          if [[ "$RC" -eq 2 || "$RC" -eq 3 || "$RC" -eq 0 ]]; then
            exit 0
          fi
          exit "$RC"
        id: loop

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-evidence-${{ github.run_id }}
          path: |
            orchestrator/autonomy-evidence.jsonl
            orchestrator/capabilities.json
            orchestrator/discovered-work.json
            orchestrator/state.json
            orchestrator/lease.json
            orchestrator/priority.json
            docs/AUTONOMY_STATUS.md
          retention-days: 90

      - name: Chain next iteration (schedule only)
        if: >-
          steps.loop.outcome == 'success' &&
          github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run cto:orchestrator >/dev/null
          TASK=$(jq -r '.next_task.id // empty' orchestrator/priority.json)
          if [[ -n "$TASK" && "$TASK" != "null" ]]; then
            gh workflow run autonomous-loop.yml || \
              echo "workflow_dispatch blocked — will retry on next schedule"
          else
            echo "Idle — no chain"
          fi

      - name: Report blocked iteration (expected founder policy)
        if: steps.loop.outputs.exit_code == '2'
        run: |
          echo "::notice::Loop blocked at push/PR create or external gate — see evidence artifact"
          echo "Founder: enable 'Allow GitHub Actions to create pull requests' in repo Settings"

      - name: Fail job if loop validation failed
        if: steps.loop.outputs.exit_code == '4'
        run: |
          echo "Loop validation failed (exit 4) — see evidence artifact"
          echo "::notice::Common causes: handler pipefail, npm test/lint in loop validation"
          exit 1
