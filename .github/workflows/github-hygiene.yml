name: GitHub Hygiene

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List actions only (no close)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: [main]
    paths:
      - "orchestrator/github-hygiene-trigger.json"
      - "scripts/github-hygiene-close.sh"
  schedule:
    - cron: "0 21 * * 0"

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: github-hygiene
  cancel-in-progress: false

jobs:
  triage-close:
    name: Close triaged issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Close shipped / duplicate issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: bash scripts/github-hygiene-close.sh

      - name: Open PR summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr list --state open --limit 10 || true
