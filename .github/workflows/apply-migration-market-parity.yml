name: Verify historical market parity schema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supabase/migration-market-parity-rounds-3-7.sql
      - scripts/verify-market-parity.mjs
      - scripts/lib/rest-schema-probe.mjs
      - scripts/lib/historical-verifiers.mjs
      - scripts/production-migration-plan.json
      - scripts/run-production-migration-phase.mjs
      - .github/workflows/apply-migration-market-parity.yml

jobs:
  verify:
    name: Read-only market parity probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify selected REST fields (never apply SQL)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-production-migration-phase.mjs --verify market-parity
