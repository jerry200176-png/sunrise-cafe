name: Engineering Governance

on:
  schedule:
    # Monday 01:00 UTC = 09:00 Asia/Taipei — weekly hygiene gate
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  governance-gate:
    name: Repository health gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run governance gate
        run: npm run cto:governance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_URL: https://sunrise-cafe-six.vercel.app

      - name: Upload governance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: governance-report
          path: |
            docs/internal/governance/GOVERNANCE_STATUS.md
            docs/internal/governance/GITHUB_TRIAGE.md
            docs/internal/governance/FOUNDER_ACTION_LIST.md
          retention-days: 30
