name: Autonomous Engineering Loop

on:
  schedule:
    # Daily 06:00 UTC = 14:00 Taipei — one unattended iteration (was */6, caused email storm)
    - cron: "0 6 * * *"
  workflow_dispatch:
    # No inputs — avoids GitHub Actions phantom push validation bug (actions/runner#4001)
  # NOTE: workflow_run on CI was removed — it caused a feedback loop (loop → push → CI → loop)
  # every ~2 min, exhausting Vercel Hobby deploy quota (24h rate limit).

concurrency:
  group: autonomous-engineering-loop
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  autonomous-iteration:
    name: Run one bounded iteration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Cooldown — skip rapid workflow_dispatch (reduces GitHub email storm)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_ISO=$(gh run list --workflow autonomous-loop.yml --event workflow_dispatch \
            --status success --limit 1 --json createdAt -q '.[0].createdAt' 2>/dev/null || echo "")
          if [[ -z "$LAST_ISO" || "$LAST_ISO" == "null" ]]; then
            echo "No prior dispatch — continue"
            exit 0
          fi
          LAST_EPOCH=$(date -d "$LAST_ISO" +%s 2>/dev/null || echo 0)
          NOW=$(date +%s)
          GAP=$((NOW - LAST_EPOCH))
          MIN_GAP="${LOOP_DISPATCH_MIN_SEC:-1800}"
          if [[ "$GAP" -lt "$MIN_GAP" ]]; then
            echo "::notice::Skipping loop — last dispatch ${GAP}s ago (< ${MIN_GAP}s cooldown)"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        id: cooldown

      - name: Configure git identity
        if: steps.cooldown.outputs.skipped != 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Probe capabilities (audit)
        if: github.event_name != 'workflow_dispatch' || steps.cooldown.outputs.skipped != 'true'
        run: bash scripts/orchestrator/capabilities.sh

      - name: Run autonomous loop
        if: github.event_name != 'workflow_dispatch' || steps.cooldown.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PROD_URL: https://sunrise-cafe-six.vercel.app
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MAX_CI_WAIT_SEC: "1200"
          DEPLOY_WAIT_SEC: "300"
          CI_FIX_ATTEMPTS: "1"
        run: |
          MODE="run"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            MODE="gha-canary"
          fi
          set +e
          bash scripts/orchestrator/loop.sh "$MODE"
          RC=$?
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          # 0=success/idle | 2=blocked (expected) | 3=lease | 4=validation fail
          if [[ "$RC" -eq 2 || "$RC" -eq 3 || "$RC" -eq 0 ]]; then
            exit 0
          fi
          exit "$RC"
        id: loop

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autonomy-evidence-${{ github.run_id }}
          path: |
            orchestrator/autonomy-evidence.jsonl
            orchestrator/capabilities.json
            orchestrator/discovered-work.json
            orchestrator/state.json
            orchestrator/lease.json
            orchestrator/priority.json
            docs/internal/automation/AUTONOMY_STATUS.md
          retention-days: 90

      - name: Report blocked iteration (expected founder policy)
        if: >-
          (github.event_name != 'workflow_dispatch' || steps.cooldown.outputs.skipped != 'true') &&
          steps.loop.outputs.exit_code == '2'
        run: |
          echo "::notice::Loop blocked at push/PR create or external gate — see evidence artifact"
          echo "Founder: enable 'Allow GitHub Actions to create pull requests' in repo Settings"

      - name: Fail job if loop validation failed
        if: >-
          (github.event_name != 'workflow_dispatch' || steps.cooldown.outputs.skipped != 'true') &&
          steps.loop.outputs.exit_code == '4'
        run: |
          echo "Loop validation failed (exit 4) — see evidence artifact"
          echo "::notice::Common causes: handler pipefail, npm test/lint in loop validation"
          exit 1
