name: Business Intelligence

on:
  schedule:
    # Daily 08:00 UTC = 16:00 Taipei
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: business-intelligence
  cancel-in-progress: false

jobs:
  snapshot:
    name: Collect business snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Business snapshot + outcome sync
        env:
          PROD_URL: https://sunrise-cafe-six.vercel.app
          CTO_OUTCOME_SECRET: ${{ secrets.CTO_OUTCOME_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm ci --ignore-scripts
          chmod +x scripts/cto-business-snapshot.sh scripts/ceo-evidence-summary.sh
          bash scripts/cto-business-snapshot.sh

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: business-snapshot-${{ github.run_id }}
          path: |
            orchestrator/business-snapshot.json
            orchestrator/ceo-evidence.json
            docs/internal/executive/OUTCOME_LOG.md
          retention-days: 90

      - name: Commit snapshot to repo
        id: push_snapshot
        continue-on-error: true
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add orchestrator/business-snapshot.json docs/internal/executive/OUTCOME_LOG.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore(bi): daily business snapshot [skip ci]"
          if ! git push; then
            echo "::notice::main is branch-protected — snapshot saved as artifact only"
            exit 0
          fi

      - name: Workflow result
        if: always()
        run: |
          test -f orchestrator/business-snapshot.json && echo "Snapshot file OK" || exit 1
