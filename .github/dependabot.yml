version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Major upgrades require an explicit migration plan, owner, and production
    # verification. Dependabot keeps routine patch/minor maintenance grouped
    # above without flooding the queue with breaking-change proposals.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Hold the SDK at the existing API contract until a payment API migration.
      - dependency-name: "stripe"
        versions: [">=22.4.0"]
  # Keeps the commit-SHA pins in .github/workflows current (version comment is updated too).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
