# Post-merge production verification
# 1) Deploy SHA must match main (required)
# 2) Migration drift via PostgREST HTTP (required when Supabase secrets present)
# Catches "merged to main but Vercel did not deploy" (see docs/incidents/2026-07-09-vercel-merge-deploy-gap.md)

name: Verify Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-sha:
    name: Production /api/version matches main
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Poll production version (auto-deploy on drift)
        env:
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
          EXPECTED_SHA: ${{ github.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          echo "Expected: $EXPECTED_SHA"
          DEPLOYED=0
          ACTUAL=""
          for i in $(seq 1 40); do
            ACTUAL=$(curl -sf "$PRODUCTION_URL/api/version" | jq -r '.commit // empty' || true)
            echo "Attempt $i: $ACTUAL"
            if [ "$ACTUAL" = "$EXPECTED_SHA" ]; then
              echo "Production matches main HEAD."
              exit 0
            fi
            if [ "$i" -ge 3 ] && [ "$DEPLOYED" -eq 0 ] && [ -n "${VERCEL_TOKEN:-}" ]; then
              echo "SHA drift — triggering vercel deploy --prod"
              DEPLOYED=1
              bash scripts/orchestrator/deploy.sh --wait 420 || true
            fi
            sleep 30
          done
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            bash scripts/orchestrator/deploy.sh --wait 90 || true
            ACTUAL=$(curl -sf "$PRODUCTION_URL/api/version" | jq -r '.commit // empty' || true)
            if [ "$ACTUAL" = "$EXPECTED_SHA" ]; then
              echo "Production matches main after final deploy attempt."
              exit 0
            fi
          fi
          echo "::error::Production ($ACTUAL) ≠ main ($EXPECTED_SHA) after retries — failing Verify Production"
          exit 1

      - name: Smoke — auth on reservation PATCH
        env:
          PRODUCTION_URL: https://sunrise-cafe-six.vercel.app
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            "$PRODUCTION_URL/api/reservations/00000000-0000-0000-0000-000000000099" \
            -H "Content-Type: application/json" -d '{"notes":"smoke"}')
          if [ "$CODE" != "401" ]; then
            echo "::error::Expected 401 for unauthenticated PATCH, got $CODE"
            exit 1
          fi
          echo "PATCH without auth returns 401."

  migration-drift:
    name: Production migration drift
    runs-on: ubuntu-latest
    needs: verify-sha
    if: success()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Migration drift check (PostgREST HTTP)
        env:
          CHECK_MIGRATION_DRIFT: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "Skipping migration drift — Supabase secrets not configured."
            exit 0
          fi
          # Optional Case B ledger reconcile (INSERT only when schema effect present)
          if [ -z "${SUPABASE_DB_URL:-}" ] || echo "${SUPABASE_DB_URL:-}" | grep -q '\[region\]'; then
            if [ -n "${VERCEL_TOKEN:-}" ]; then
              bash scripts/vercel-production-env.sh .env.vercel.prod || true
              for key in POSTGRES_URL POSTGRES_URL_NON_POOLING POSTGRES_PRISMA_URL SUPABASE_DB_URL DATABASE_URL DIRECT_URL; do
                val=$(grep -E "^${key}=" .env.vercel.prod 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' || true)
                if [ -n "$val" ] && ! echo "$val" | grep -q '\[region\]'; then
                  export "$key=$val"
                fi
              done
              if [ -z "${SUPABASE_DB_URL:-}" ] || echo "${SUPABASE_DB_URL:-}" | grep -q '\[region\]'; then
                export SUPABASE_DB_URL="${POSTGRES_URL_NON_POOLING:-${POSTGRES_URL:-${POSTGRES_PRISMA_URL:-${DATABASE_URL:-${DIRECT_URL:-}}}}}"
              fi
            fi
          fi
          node scripts/reconcile-migration-ledger.mjs || true
          if [ -n "${SUPABASE_DB_URL:-}" ] && ! echo "${SUPABASE_DB_URL:-}" | grep -q '\[region\]'; then
            node scripts/reconcile-migration-ledger.mjs --apply || {
              echo "::warning::Ledger reconcile apply failed — continuing to drift check"
            }
          fi
          bash scripts/check-migration-drift.sh
